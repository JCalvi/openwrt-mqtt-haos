name: OpenWrt MQTT shell tests

on:
  push:
    paths:
      - openwrt_mqtt.sh
      - tests/**
      - .github/workflows/shell-tests.yml
  pull_request:
    paths:
      - openwrt_mqtt.sh
      - tests/**
      - .github/workflows/shell-tests.yml
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression checks
        shell: bash
        run: |
          sh -n openwrt_mqtt.sh
          sh -n tests/test_telemetry_publish.sh
          sh -n tests/test_service_lifecycle.sh
          sh tests/test_telemetry_publish.sh
          sh tests/test_service_lifecycle.sh

          python3 tests/test_mwan.py
